name: GermanVocab
options:
  bundleIdPrefix: de.nimakhabbazi
  deploymentTarget:
    iOS: "26.0"
    watchOS: "10.0"
settings:
  SWIFT_VERSION: "5.0"
  DEVELOPMENT_TEAM: KK43VTCM64
targets:
  GermanVocab:
    type: application
    platform: iOS
    sources:
      - GermanVocab
    dependencies:
      - target: GermanVocabWatch
        embed: true
      - target: GermanVocabWidget
        embed: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: de.nimakhabbazi.germanvocab
      TARGETED_DEVICE_FAMILY: "1,2"
      INFOPLIST_FILE: GermanVocab/Info.plist
      CODE_SIGN_ENTITLEMENTS: GermanVocab/GermanVocab.entitlements
      GENERATE_INFOPLIST_FILE: false
      SWIFT_VERSION: "5.0"
      DEVELOPMENT_TEAM: KK43VTCM64
      CODE_SIGN_IDENTITY: "iPhone Developer"
      BASE_SDK: iphoneos
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GermanVocabWatch:
    type: application
    platform: watchOS
    sources:
      - path: GermanVocabWatch
        excludes:
          - Info.plist
      - path: GermanVocab/Config.swift
      - path: GermanVocab/Models.swift
      - path: GermanVocab/APIClient.swift
      - path: GermanVocab/Theme.swift
      - path: GermanVocab/StudyNotificationScheduler.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: de.nimakhabbazi.germanvocab.watchkitapp
      INFOPLIST_FILE: GermanVocabWatch/Info.plist
      GENERATE_INFOPLIST_FILE: false
      SWIFT_VERSION: "5.0"
      DEVELOPMENT_TEAM: KK43VTCM64
      CODE_SIGN_IDENTITY: "iPhone Developer"
      WATCHOS_DEPLOYMENT_TARGET: "10.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GermanVocabWidget:
    type: app-extension
    platform: iOS
    sources:
      - GermanVocabWidget
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: de.nimakhabbazi.germanvocab.widget
      INFOPLIST_FILE: GermanVocabWidget/Info.plist
      CODE_SIGN_ENTITLEMENTS: GermanVocabWidget/GermanVocabWidget.entitlements
      GENERATE_INFOPLIST_FILE: false
      SWIFT_VERSION: "5.0"
      DEVELOPMENT_TEAM: KK43VTCM64
      CODE_SIGN_IDENTITY: "iPhone Developer"
      TARGETED_DEVICE_FAMILY: "1,2"
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      SKIP_INSTALL: true
schemes:
  GermanVocab:
    build:
      targets:
        GermanVocab: all
        GermanVocabWatch: all
        GermanVocabWidget: all
    run:
      config: Debug
  GermanVocabWatch:
    build:
      targets:
        GermanVocabWatch: all
        GermanVocab: all
    run:
      config: Debug
      executable: GermanVocabWatch
